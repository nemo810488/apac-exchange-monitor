name: Monthly update

on:
  schedule:
    # 15th of each month, 02:00 UTC (13:00 Sydney). Exchanges publish the previous
    # month's statistics in the first 5-15 days, so this picks up the month that
    # just closed with roughly a two-week delay.
    - cron: "0 2 15 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "How many trailing months to (re)collect"
        default: "3"
      only:
        description: "Comma-separated collector names (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          MONTHS: ${{ github.event.inputs.months || '3' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python collect.py

      - name: FX rates
        env:
          MONTHS: ${{ github.event.inputs.months || '3' }}
        run: python fx.py

      - name: Validate
        run: python validate.py

      - name: Build site data
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "apac-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add observations.csv fx_monthly.csv summary_latest.csv data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: monthly update $(date -u +%Y-%m-%d)"
            git push
          fi
